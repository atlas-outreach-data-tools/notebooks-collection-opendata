name: Python package

on:
  push:
  pull_request:

jobs:

  clean-notebook:
    name: Ensure Clean Notebook
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # Fails if any notebook still has outputs or execution counts.
    # Fix locally with: nbstripout <notebook>.ipynb
    - name: Check notebooks are stripped
      uses: kynan/nbstripout@0.9.1



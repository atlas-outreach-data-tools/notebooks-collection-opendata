name: Python package

on:
  push:
  pull_request:

jobs:

  clean-notebook:
    name: Ensure Clean Notebook
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    # Fails if any notebook breaks the output policy in .pre-commit-config.yaml.
    # Fix locally with: pre-commit run --all-files
    - name: Check notebook outputs follow the policy
      uses: pre-commit/action@v3.0.1



name: analysis
channels:
    - conda-forge
dependencies:
  - libmamba>=2.0.4
  # Keep in line with the Python version of the base image in the Dockerfile.
  - python=3.13
  - root_base>=6.32.2
  # Packages with compiled code built against NumPy are installed with conda,
  # so that conda keeps them consistent with the NumPy it installs. 
  - numpy>=2.2
  - scipy
  - pandas>=2.2.2
  - matplotlib-base>=3.9.1
  - scikit-learn>=1.5.1
  - numba
  - pip:
    - aiohttp>=3.9.5
    - atlasopenmagic>=1.11.1
    - awkward>=2.6.7
    - awkward-pandas>=2023.8.0
    - coffea[dask]>=2026.11.0  # processor.Runner + DaskExecutor, used in CoffeaHZZAnalysis
    # - dask[distributed]>=2025.2.0
    - fsspec>=2025.7.0
    - hist>=2.8.0
    - ipykernel>=6.29.5
    - jupyter>=1.0.0
    - lmfit>=1.3.2
    - metakernel>=0.30.2
    - notebook>=7
    - papermill>=2.6.0
    - pip>=24.2
    - uproot==5.7.5  # 5.7.6-5.7.7: XRootD offset TypeError; 5.7.8: EOS rejects batched basket-key reads
    - fsspec-xrootd>=0.5.1
    - jupyterlab_latex>=4
    - vector>=1.4.1
